<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Resume Hub — Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options">
    <header>
      <h1>No manual setup</h1>
      <p>
        Supabase and API URLs are taken from the web app <code>.env</code> when you run
        <code>npm run build:extension</code>.
      </p>
      <p class="hint">
        Rebuild the extension after changing <code>.env</code>, then click Reload on
        <code>chrome://extensions</code>.
      </p>
    </header>
  </body>
</html>
